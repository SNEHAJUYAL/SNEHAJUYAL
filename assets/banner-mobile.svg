<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#141d38"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/></pattern>
</defs>
<style>
  text { font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
  .m { font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

  .grow { transform-box:fill-box; transform-origin:bottom; animation:grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(.6); opacity:.5; } 50% { transform:scale(1.3); opacity:.15; } }
  .role { opacity:0; animation:role 9s infinite both; }
  @keyframes role { 0% { opacity:0; transform:translateY(8px); } 6% { opacity:1; transform:none; } 30% { opacity:1; } 35%,100% { opacity:0; } }
</style>
<rect width="420" height="300" rx="16" fill="url(#bg)"/><rect width="420" height="300" rx="16" fill="url(#dots)"/><rect x=".5" y=".5" width="419" height="299" rx="16" fill="none" stroke="#2a3658"/>
<text class="m" x="28" y="44" font-size="12.5" fill="#22d3ee">~/sneha-juyal  $  whoami</text>
<text x="28" y="100" font-size="42" font-weight="700" fill="#e6edf3" letter-spacing="-1">Sneha Juyal</text>
<text class="role" style="animation-delay:0s" x="28" y="150" font-size="19" fill="#c4b5fd">Data → analysis → decisions</text><text class="role" style="animation-delay:3s" x="28" y="150" font-size="19" fill="#c4b5fd">Models evaluated honestly</text><text class="role" style="animation-delay:6s" x="28" y="150" font-size="19" fill="#c4b5fd">Services that ship in containers</text>
<text class="m" x="28" y="186" font-size="12" fill="#8b98b5">Python · SQL · Excel · scikit-learn</text>
<text class="m" x="28" y="204" font-size="12" fill="#8b98b5">FastAPI · Docker</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#141d38"/></linearGradient>
<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/></pattern>
</defs>
<style>
  text { font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
  .m { font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  .flow { animation:flow 1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-10; } }
</style>
<rect width="1000" height="150" rx="14" fill="url(#bg)"/><rect width="1000" height="150" rx="14" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="149" rx="14" fill="none" stroke="#2a3658"/>
<line class="flow" x1="180" y1="74" x2="216" y2="74" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
<line class="flow" x1="376" y1="74" x2="412" y2="74" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
<line class="flow" x1="572" y1="74" x2="608" y2="74" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
<line class="flow" x1="768" y1="74" x2="804" y2="74" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
<circle r="5" fill="#fbbf24"><animateMotion dur="7s" repeatCount="indefinite" path="M 30 74 H 970"/></circle>
<text class="m" x="20" y="34" font-size="11.5" fill="#8b98b5">01</text><rect x="20" y="44" width="160" height="60" rx="12" fill="#141d38" stroke="#22d3ee" stroke-opacity=".7"/><text x="100" y="70" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">Ingest</text><text class="m" x="100" y="90" font-size="11" text-anchor="middle" fill="#8b98b5">APIs · CSV · SQL</text>
<text class="m" x="216" y="34" font-size="11.5" fill="#8b98b5">02</text><rect x="216" y="44" width="160" height="60" rx="12" fill="#141d38" stroke="#a78bfa" stroke-opacity=".7"/><text x="296" y="70" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">Clean</text><text class="m" x="296" y="90" font-size="11" text-anchor="middle" fill="#8b98b5">Pandas · SQL</text>
<text class="m" x="412" y="34" font-size="11.5" fill="#8b98b5">03</text><rect x="412" y="44" width="160" height="60" rx="12" fill="#141d38" stroke="#22d3ee" stroke-opacity=".7"/><text x="492" y="70" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">Model</text><text class="m" x="492" y="90" font-size="11" text-anchor="middle" fill="#8b98b5">scikit-learn · XGBoost</text>
<text class="m" x="608" y="34" font-size="11.5" fill="#8b98b5">04</text><rect x="608" y="44" width="160" height="60" rx="12" fill="#141d38" stroke="#a78bfa" stroke-opacity=".7"/><text x="688" y="70" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">Serve</text><text class="m" x="688" y="90" font-size="11" text-anchor="middle" fill="#8b98b5">FastAPI · Docker</text>
<text class="m" x="804" y="34" font-size="11.5" fill="#8b98b5">05</text><rect x="804" y="44" width="160" height="60" rx="12" fill="#141d38" stroke="#22d3ee" stroke-opacity=".7"/><text x="884" y="70" font-size="17" font-weight="600" text-anchor="middle" fill="#e6edf3">Decide</text><text class="m" x="884" y="90" font-size="11" text-anchor="middle" fill="#8b98b5">Dashboards · reports</text>
<text class="m" x="20" y="132" font-size="12" fill="#8b98b5">same loop, whether the output is a dashboard, a model or an API</text>
</svg>
